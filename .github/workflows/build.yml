name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab too

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      # Debug builds are auto-signed with a throwaway debug key — installable on your
      # own phone right away, no keystore needed. Good enough while you're testing.
      # Switch to `assembleRelease` (see README) once you're ready to hand this to a
      # client and have set up RELEASE_* secrets.

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
